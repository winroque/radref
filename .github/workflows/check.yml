name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly re-check of DOIs (Mondays)
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Entries valid and index up to date
        run: python3 scripts/build_index.py --check
      - name: References match Crossref
        run: python3 scripts/check_refs.py
